[project]
name = "q50diag"
version = "0.1.0"
description = "Car diagnostic app for KWP2000, UDS and OBD-II over ELM327-compatible adapters, with an embedded Claude agent"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mitchell Foutz" }]
dependencies = [
    "pyserial>=3.5",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "numpy>=1.25",
    "claude-agent-sdk>=0.2.173",
]

[project.urls]
Repository = "https://github.com/darblinko/q50-obd-scanner"

[project.scripts]
q50diag = "q50diag.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]
# Build-only: packaging/q50diag.spec (`uv sync --group package`).
package = ["pyinstaller==6.22.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python-preference = "only-system"
# cryptography 49 and later publish no macOS x86_64 wheels; a source build links
# Homebrew OpenSSL and clashes with the libssl the frozen app bundles.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B905: zip() truncation is relied on in places. SIM108: nested ternaries read worse.
ignore = ["B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from tests/test_gui_fakes.py are redefined as test parameters.
"tests/*" = ["F811"]
