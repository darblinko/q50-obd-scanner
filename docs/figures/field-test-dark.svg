<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 174" width="760" height="174" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Field test on a 2017 Infiniti Q50 3.0t, 2026-10-17</title><desc>13 modules answered a 65 second discovery sweep, 2 modules stored 3 confirmed codes, an unfiltered 5 second bus monitor received 0 broadcast frames, and the decoded EPS angle correlated at -1.00 with the ABS steering angle.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="24.0" y="30.0" font-size="16" font-weight="600" fill="#f0efec" text-anchor="start">Field test on a 2017 Infiniti Q50 3.0t, 2026-10-17</text><line x1="24.0" y1="60.0" x2="24.0" y2="130.0" stroke="#383835" stroke-width="2"/><text x="38.0" y="94.0" font-size="32" font-weight="600" fill="#f0efec" text-anchor="start">13</text><text x="38.0" y="114.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Modules answered</text><text x="38.0" y="130.0" font-size="11" font-weight="400" fill="#9a988f" text-anchor="start">65 s discovery sweep</text><line x1="202.0" y1="60.0" x2="202.0" y2="130.0" stroke="#383835" stroke-width="2"/><text x="216.0" y="94.0" font-size="32" font-weight="600" fill="#f0efec" text-anchor="start">3</text><text x="216.0" y="114.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Stored codes</text><text x="216.0" y="130.0" font-size="11" font-weight="400" fill="#9a988f" text-anchor="start">RADAR 2, AIR BAG 1</text><line x1="380.0" y1="60.0" x2="380.0" y2="130.0" stroke="#383835" stroke-width="2"/><text x="394.0" y="94.0" font-size="32" font-weight="600" fill="#f0efec" text-anchor="start">0</text><text x="394.0" y="114.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Broadcast frames</text><text x="394.0" y="130.0" font-size="11" font-weight="400" fill="#9a988f" text-anchor="start">5 s unfiltered monitor</text><line x1="558.0" y1="60.0" x2="558.0" y2="130.0" stroke="#383